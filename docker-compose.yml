# =============================================================================
# Stack dla Coolify — Docker Compose.
#
# W Coolify: New Resource -> Docker Compose -> wklej ten plik lub wskaż repo.
# Zmienne pochodzą z zakładki Environment Variables (patrz .env.example).
#
# Publicznie wystawiamy TYLKO:
#   * metabase  (np. bi.twojadomena.pl)
#   * ingest    (np. rozliczenia.twojadomena.pl) — chroniony kluczem API i Basic Auth
# Postgres i n8n zostają w sieci wewnętrznej (n8n opcjonalnie z własną domeną).
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-settlements}
      POSTGRES_USER: ${POSTGRES_USER:-settlements}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD}
      # wymusza sensowne kodowanie dla polskich znaków
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      METABASE_DB: ${METABASE_DB:-metabase}
      N8N_DB: ${N8N_DB:-n8n}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # tworzy osobne bazy dla Metabase i n8n przy pierwszym starcie
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-settlements} -d ${POSTGRES_DB:-settlements}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # BEZ portu na zewnątrz — baza jest dostępna tylko w sieci Dockera.
    networks: [rozliczenia]

  # -------------------------------------------------------------------------
  # Worker: API przyjmujące pliki + parser + loader + dbt
  # -------------------------------------------------------------------------
  ingest:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-settlements}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-settlements}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-settlements}
      POSTGRES_USER: ${POSTGRES_USER:-settlements}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INGEST_API_KEY: ${INGEST_API_KEY:?ustaw INGEST_API_KEY}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ustaw ADMIN_PASSWORD}
      ARCHIVE_DIR: /data/archive
      RUN_DBT_AFTER_LOAD: "true"
      RECON_TOLERANCE: "0.01"
      # Coolify: ustaw poniższą zmienną, aby wystawić usługę na domenie
      SERVICE_FQDN_INGEST: ${INGEST_FQDN:-}
    volumes:
      - archive:/data/archive          # niezmienne archiwum otrzymanych plików
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [rozliczenia]

  # -------------------------------------------------------------------------
  # Metabase — warstwa wizualizacji.
  # Trzyma własne metadane w tej samej bazie, ale w osobnym schemacie/bazie.
  # -------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.52.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB:-metabase}
      MB_DB_PORT: "5432"
      MB_DB_USER: ${POSTGRES_USER:-settlements}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_SITE_LOCALE: pl
      MB_START_OF_WEEK: monday
      JAVA_TIMEZONE: Europe/Warsaw
      SERVICE_FQDN_METABASE: ${METABASE_FQDN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [rozliczenia]

  # -------------------------------------------------------------------------
  # n8n — nasłuch skrzynki i wyzwalanie pipeline'u.
  # Jeśli masz już n8n na Coolify, usuń tę usługę i podłącz istniejącą
  # instancję do sieci "rozliczenia" (patrz README).
  # -------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:1.75.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-settlements}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: Europe/Warsaw
      TZ: Europe/Warsaw
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?ustaw N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_FQDN:-localhost}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_FQDN:-localhost}/
      N8N_RUNNERS_ENABLED: "true"
      SERVICE_FQDN_N8N: ${N8N_FQDN:-}
    volumes:
      - n8ndata:/home/node/.n8n
    networks: [rozliczenia]

  # -------------------------------------------------------------------------
  # Kopie zapasowe: codzienny pg_dump do wolumenu (i opcjonalnie do S3).
  # -------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENCJA_DNI: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Serwis kopii zapasowych uruchomiony — zrzut codziennie o 03:15";
        while true; do
          teraz=$$(date +%H%M);
          if [ "$$teraz" = "0315" ]; then
            plik=/backups/settlements_$$(date +%Y%m%d_%H%M).sql.gz;
            echo "Tworzę kopię $$plik";
            pg_dump -h postgres -U ${POSTGRES_USER:-settlements} -d ${POSTGRES_DB:-settlements} \
              | gzip > $$plik || echo "BŁĄD kopii zapasowej";
            find /backups -name '*.sql.gz' -mtime +$${RETENCJA_DNI} -delete;
            sleep 90;
          fi;
          sleep 45;
        done
    networks: [rozliczenia]

volumes:
  pgdata:
  archive:
  n8ndata:
  backups:

networks:
  rozliczenia:
    driver: bridge

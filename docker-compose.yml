# =============================================================================
# Stack dla Coolify — Docker Compose.
#
# W Coolify: New Resource -> Docker Compose -> wklej ten plik lub wskaż repo.
# Zmienne pochodzą z zakładki Environment Variables (patrz .env.example).
#
# Publicznie wystawiamy TYLKO dwie usługi (domeny ustawiasz w UI Coolify,
# w polu "Domains" przy każdej usłudze — patrz runbook, krok 04):
#   * metabase  ->  https://bi.twojadomena.pl:3000
#   * ingest    ->  https://rozliczenia.twojadomena.pl:8000
# Postgres i backup nie mają domeny — są dostępne wyłącznie w sieci Dockera.
#
# n8n NIE jest częścią tego stacku: używamy n8n Cloud, który łączy się
# z workerem przez publiczny HTTPS i klucz API.
#
# CELOWO NIE definiujemy własnej sieci. Coolify podpina usługi z domeną do
# sieci swojego proxy (Traefik) i tworzy dla nich routing. Własna sieć potrafi
# to zablokować — objawia się to błędem 404 z Traefika i certyfikatem
# samopodpisanym, mimo że build i kontenery działają poprawnie. Usługi i tak
# widzą się nawzajem po nazwie w domyślnej sieci projektu, a Postgres pozostaje
# niedostępny z zewnątrz, bo nie publikuje żadnego portu.
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-settlements}
      POSTGRES_USER: ${POSTGRES_USER:-settlements}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD}
      # wymusza sensowne kodowanie dla polskich znaków
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      METABASE_DB: ${METABASE_DB:-metabase}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # tworzy osobną bazę dla Metabase przy pierwszym starcie
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-settlements} -d ${POSTGRES_DB:-settlements}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # BEZ portu na zewnątrz — baza jest dostępna tylko w sieci projektu.

  # -------------------------------------------------------------------------
  # Worker: API przyjmujące pliki + parser + loader + dbt
  # -------------------------------------------------------------------------
  ingest:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-settlements}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-settlements}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-settlements}
      POSTGRES_USER: ${POSTGRES_USER:-settlements}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INGEST_API_KEY: ${INGEST_API_KEY:?ustaw INGEST_API_KEY}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ustaw ADMIN_PASSWORD}
      ARCHIVE_DIR: /data/archive
      RUN_DBT_AFTER_LOAD: "true"
      RECON_TOLERANCE: "0.01"
    expose:
      - "8000"
    volumes:
      - archive:/data/archive          # niezmienne archiwum otrzymanych plików
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------------------
  # Metabase — warstwa wizualizacji.
  # Trzyma własne metadane w osobnej bazie na tym samym Postgresie.
  #
  # UWAGA NA ARCHITEKTURĘ: obrazy Metabase są wieloarchitekturowe (amd64 +
  # arm64) dopiero od nowszych wydań — starsze tagi, np. v0.52.8, istnieją
  # wyłącznie dla amd64 i na serwerze ARM kończą się ostrzeżeniem
  # "does not match the detected host platform" oraz uruchomieniem pod emulacją
  # QEMU (albo brakiem startu). Dla JVM emulacja oznacza wielokrotnie wolniejszy
  # start i losowe zawieszki, więc trzymamy się tagu z natywnym arm64.
  #
  # v0.58-lts to linia długiego wsparcia; poniżej przypięte konkretne wydanie,
  # żeby redeploy nie podmienił wersji bez Twojej decyzji. Jeśli wolisz
  # automatyczne łatki w obrębie linii LTS, użyj tagu v0.58-lts.
  # -------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.58.31
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB:-metabase}
      MB_DB_PORT: "5432"
      MB_DB_USER: ${POSTGRES_USER:-settlements}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      MB_SITE_LOCALE: pl
      MB_START_OF_WEEK: monday
      JAVA_TIMEZONE: Europe/Warsaw
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # -------------------------------------------------------------------------
  # Kopie zapasowe: codzienny pg_dump do wolumenu (i opcjonalnie do S3).
  # -------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RETENCJA_DNI: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Serwis kopii zapasowych uruchomiony — zrzut codziennie o 03:15";
        while true; do
          teraz=$$(date +%H%M);
          if [ "$$teraz" = "0315" ]; then
            plik=/backups/settlements_$$(date +%Y%m%d_%H%M).sql.gz;
            echo "Tworzę kopię $$plik";
            pg_dump -h postgres -U ${POSTGRES_USER:-settlements} -d ${POSTGRES_DB:-settlements} \
              | gzip > $$plik || echo "BŁĄD kopii zapasowej";
            find /backups -name '*.sql.gz' -mtime +$${RETENCJA_DNI} -delete;
            sleep 90;
          fi;
          sleep 45;
        done

volumes:
  pgdata:
  archive:
  backups:
